# One target per chain; the oracle has the same address on each.
base-settings:
  user-workflow:
    workflow-name: "github-keys-base"
    deployment-registry: "private"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.base.json"
    secrets-path: "../secrets.yaml"

