[profile.default]
src = "src"
out = "out"
libs = ["lib"]
evm_version = "osaka" # P-256 precompile at 0x100 (EIP-7951)
optimizer = true
optimizer_runs = 200
ffi = false
fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "read-write", path = "./deployments" }]
# Account addresses are CREATE2 over bytecode. Exact `pragma solidity` versions pin the compiler, and dropping
# the metadata hash keeps comment-only edits from changing bytecode (and therefore every address).
bytecode_hash = "none"
cbor_metadata = false

[rpc_endpoints]
sepolia = "https://ethereum-sepolia-rpc.publicnode.com"
base_sepolia = "https://sepolia.base.org"
arbitrum_sepolia = "https://sepolia-rollup.arbitrum.io/rpc"
